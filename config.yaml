# HardwareScraper configuration
# All fee rates, thresholds, and search parameters live here — not in code.

ebay:
  app_id: ""         # eBay Developer Program App ID (Client ID)
  cert_id: ""        # eBay Cert ID (Client Secret)
  environment: "production"   # "production" or "sandbox"
  comps_days_back: 60         # how far back to look for sold listings
  comps_cache_hours: 24       # cache TTL for eBay comps per (canonical_name, condition)
  max_comps_per_query: 50     # max sold listings to fetch per eBay search

notifications:
  discord_webhook_url: "https://discordapp.com/api/webhooks/1517662889308061706/U_irLh-Lzd7_UQySOai61KhdJIMTXzF6Cm-ZegVuZkQ4cqCWhI7xjAXR4GeB02J6HSn5"       # paste your Discord channel webhook URL here
  min_margin_tier: 2            # notify on Tier 1 (Excellent) and Tier 2 (Good)
  max_per_run: 10               # max listings to send per run
  for_parts_min_repair_upside: 50  # only notify on for-parts if repair upside >= $50

fees:
  platform: ebay              # ebay = 13.25% flat; amazon = 8% + $0.99/item
  ebay_rate: 0.1325           # eBay standard electronics referral rate
  amazon_referral_rate: 0.08  # Amazon referral fee for electronics
  amazon_per_item_fee: 0.99   # Amazon individual seller per-item closing fee
  outbound_shipping: 15.00    # fallback shipping (superseded by shipping.by_category)

shipping:
  default: 15.00              # fallback if category not in by_category
  by_category:
    cpu: 8.00
    ram: 6.00
    ssd: 7.00
    hdd: 10.00
    gpu: 15.00
    motherboard: 12.00
    psu: 12.00
    cooling: 10.00
    case: 30.00
    laptop: 15.00
    desktop: 40.00
    console: 12.00
    phone: 8.00

margin_tiers:
  excellent: 50               # >= 50% → Tier 1: Excellent
  good: 30                    # >= 30% → Tier 2: Good
  marginal: 15                # >= 15% → Tier 3: Marginal
  low: 0                      # >= 0%  → Tier 4: Low
                              # <  0%  → Tier 5: Overpriced

scraping:
  location_zip: "02766"       # your zip code for local marketplace searches
  radius_miles: 40            # search radius (covers Lowell MA to past Providence RI)
  rate_limit_seconds: 3.0     # delay between requests (be respectful)
  headless: true             # set to true after first login to OfferUp
  session_dir: "data/browser_session"   # persistent Playwright session path

facebook:
  session_dir: "data/facebook_session"  # persistent Playwright session for FB login
  enabled: true
  headless: true               # set false for first login, then back to true
  latitude: 41.9762            # North Attleborough MA (zip 02766)
  longitude: -71.3326
  radius_miles: 40             # matches scraping.radius_miles
  # If results show wrong city, paste your FB Marketplace city URL here.
  # Visit facebook.com/marketplace and click your city; copy the URL (e.g. ".../marketplace/attleboro-ma/").
  # Leave blank to use lat/lon URL params instead.
  city_marketplace_url: "https://www.facebook.com/marketplace/105616702804216"

search:
  queries:                    # default search terms; override via CLI --query
    # GPUs
    - "RTX 3070"
    - "RTX 3080"
    - "RTX 3090"
    - "RTX 2060"
    - "RTX 2070"
    - "RTX 2080"
    - "RX 6800"
    - "RX 6700 XT"
    - "RX 5700 XT"
    # CPUs
    - "i7-12700"
    - "i9-12900"
    - "i5-12600K"
    - "Ryzen 7 5800X"
    - "Ryzen 9 5900X"
    - "Ryzen 5 5600X"
    # Consoles
    - "PS5"
    - "Xbox Series X"
    - "Nintendo Switch"
    - "Nintendo Switch OLED"
    - "Steam Deck"
    - "broken PS4"
    - "broken PS5"
    - "broken Xbox"
    # Phones
    - "iPhone 14"
    - "iPhone 15"
    - "Samsung Galaxy S22"
    - "Samsung Galaxy S23"
    - "cracked screen iPhone"
    - "broken iPhone"
    # Laptops — Apple
    - "MacBook Pro"
    - "MacBook Air"
    - "MacBook M1"
    - "MacBook M2"
    - "MacBook M3"
    # Laptops — Lenovo
    - "ThinkPad"
    - "ThinkPad X1 Carbon"
    - "IdeaPad"
    # Laptops — Dell
    - "Dell XPS"
    - "Dell Latitude"
    - "Dell Inspiron"
    # Laptops — HP
    - "HP EliteBook"
    - "HP ProBook"
    - "HP Pavilion"
    - "HP Envy"
    - "HP Omen"
    # Laptops — ASUS
    - "ASUS ZenBook"
    - "ASUS VivoBook"
    - "ASUS ROG"
    # Laptops — Acer
    - "Acer Aspire"
    - "Acer Nitro"
    # Laptops — Microsoft
    - "Surface Pro"
    - "Surface Laptop"
    - "Surface Book"
    # Laptops — other
    - "Razer Blade"
    - "MSI laptop"
    - "gaming laptop"
    # For-parts / broken
    - "broken laptop"
    - "broken MacBook"
    - "broken laptop not turning on"
    - "gpu not working"
    - "for parts desktop"

craigslist:
  enabled: true
  subdomain: "boston"        # CL metro subdomain closest to you (boston, providence, etc.)

mercari:
  enabled: true              # Nationwide; factor in ~$10-20 inbound shipping cost per buy

ebay_local:
  enabled: true              # eBay listings with local pickup only, filtered by ZIP + radius
  buy_it_now_only: true      # exclude auction-format listings (dealers with many auctions clutter results)

amazon:
  enabled: false             # Scrape Amazon active listings as primary resale price reference
                             # Amazon bot detection is aggressive; enable only if willing to handle CAPTCHAs
  session_dir: "data/amazon_session"
  rate_limit_seconds: 5.0    # Amazon needs more time between requests than eBay

database:
  url: "sqlite:///data/hardware_scraper.db"

output:
  csv_dir: "data/exports"
  min_margin_to_show: 15      # show Marginal+ by default; use -9999 or UI toggle to see all

llm:
  enabled: true              # set true to enable Claude Haiku fallback for low-confidence titles
  api_key: ${ANTHROPIC_API_KEY}                 # leave blank to use ANTHROPIC_API_KEY env var
  model: "claude-haiku-4-5"
  confidence_threshold: 0.5   # listings below this score are sent to the LLM
  validate_margin_threshold: 60  # LLM-confirm all valuations with margin above this %
