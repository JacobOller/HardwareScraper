[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware-scraper"
version = "0.1.0"
description = "Find underpriced PC hardware on local marketplaces and estimate resale value via eBay"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "playwright-stealth>=1.0",
    "anthropic>=0.50",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[project.scripts]
hardware-scraper = "hardware_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
python = "3.12"
